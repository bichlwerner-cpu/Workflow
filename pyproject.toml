[project]
name = "yt-automation"
version = "0.1.0"
description = "YouTube content pipeline: Topic -> Claude script -> ElevenLabs TTS -> FFmpeg video"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.92.0",
    "elevenlabs>=1.5.0",
    "edge-tts>=6.1.12",
    "python-dotenv>=1.0.0",
    "pydantic>=2.6.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "Pillow>=10.0.0",
    "faster-whisper>=1.0.3",
    "yt-dlp>=2024.10.7",
]

[project.scripts]
yt-automation = "yt_automation.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
