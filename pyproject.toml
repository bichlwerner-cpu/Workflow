[project]
name = "yt-automation"
version = "0.2.0"
description = "Fully automated stickman YouTube channel: topic -> psychology script -> TTS -> procedural animation -> captions -> video + thumbnail + metadata"
requires-python = ">=3.10"
dependencies = [
    "edge-tts>=6.1.12",
    "python-dotenv>=1.0.0",
    "pydantic>=2.6.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
# Claude-written scripts (otherwise curated/template scripts are used, offline).
claude = ["anthropic>=0.92.0"]
# Higher-quality paid TTS voice.
elevenlabs = ["elevenlabs>=1.5.0"]
# Word-perfect captions via Whisper (edge-tts already gives free word timings).
captions = ["faster-whisper>=1.0.3"]
# Download stock/CC footage for the legacy footage background path.
footage = ["yt-dlp>=2024.10.7"]
# Upload finished episodes straight to YouTube.
upload = ["google-api-python-client>=2.100.0", "google-auth-oauthlib>=1.2.0"]
dev = ["pytest>=8.0.0"]
all = [
    "anthropic>=0.92.0",
    "elevenlabs>=1.5.0",
    "faster-whisper>=1.0.3",
    "yt-dlp>=2024.10.7",
    "google-api-python-client>=2.100.0",
    "google-auth-oauthlib>=1.2.0",
]

[project.scripts]
yt-automation = "yt_automation.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
