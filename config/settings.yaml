# ----------------------------------------------------------------------------
# Stickman Studio — global settings
# ----------------------------------------------------------------------------

# Script language. English targets the largest audience for psychology content.
language: en

video:
  width: 1920
  height: 1080
  fps: 30
  # Internal render scale for anti-aliased lines (2.0 = draw at 4K, downscale).
  # Lower to 1.5 for faster renders on weak machines.
  supersample: 2.0
  crf: 19            # x264 quality (lower = better, 17-21 sensible)
  preset: medium     # x264 speed/quality tradeoff
  target_minutes: 5  # target spoken length of one video (short-paced, 4-6 min)
  words_per_minute: 170

audio:
  # mp3_44100_128 works on every paid ElevenLabs plan. Upgrade options if your
  # plan supports them: mp3_44100_192 (Creator+), pcm_44100 (Pro+, lossless —
  # wrapped to WAV locally without transcoding).
  output_format: mp3_44100_128
  sample_rate: 44100
  line_gap: 0.06     # pause between narration beats (seconds) — short-pace cuts
  scene_gap: 0.22    # extra pause between scenes
  chapter_gap: 0.45  # extra pause between chapters
  lead_in: 0.30      # silence before the first word
  tail: 1.30         # silence + held frame after the last word
  # Background music: a soft seamless loop is auto-generated to this path on the
  # first render if the file is missing. Drop your own .mp3/.wav here to override,
  # or set bgm_path: "" to disable music entirely.
  bgm_path: assets/music/bgm.wav
  bgm_volume_db: -22               # music level before sidechain ducking
  sfx: true                        # swoosh on cuts, click on icons, impact on shocks
  sfx_volume_db: -3                # sound-effects level in the mix
  loudnorm: true                   # normalize final mix to -14 LUFS (YouTube)

subtitles:
  burn_in: true      # hard-burn styled captions into the video
  karaoke: true      # per-word highlight (strong retention device)
  font_name: DejaVu Sans
  font_size: 78      # big and bold — captions must pop
  margin_v: 110
  outline: 6         # thick black outline so text reads on any background
  shadow: 3
  max_words_per_cue: 4
  max_chars_per_cue: 30

style:
  accent: "#FFD60A"        # channel accent color (props, highlights, progress bar)
  progress_bar: true       # thin progress bar at the bottom (retention device)
  chapter_cards: true      # chapter title overlay at each chapter start
  watermark: ""            # e.g. "@YourHandle", drawn bottom-right; empty = off

# First readable TTF wins. Drop a display font (e.g. Anton, Archivo Black)
# into assets/fonts/ for better thumbnails and captions.
fonts:
  - assets/fonts/Anton-Regular.ttf
  - /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
  - /usr/share/fonts/dejavu/DejaVuSans-Bold.ttf
  - /Library/Fonts/Arial Bold.ttf
  - C:/Windows/Fonts/arialbd.ttf

# Script generation provider:
#   gemini — FREE via Google AI Studio key (https://aistudio.google.com/apikey),
#            no credit card; free tier (~10 req/min, 250/day) is plenty.
#   claude — paid Anthropic API, best script quality
#            (set provider: claude and model: claude-opus-4-8).
# gemini-2.5-pro writes noticeably better scripts; if your free key hits its
# (small) Pro quota or has no Pro access, the pipeline automatically falls
# back to gemini-2.5-flash.
llm:
  provider: gemini
  model: gemini-2.5-pro
  max_tokens: 16000

youtube:
  category_id: "27"        # Education
  privacy_status: private  # upload private first, publish manually after review
  made_for_kids: false
  description_footer: |
    ---
    New video every week. Subscribe so you don't miss the next one.
