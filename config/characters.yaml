# ----------------------------------------------------------------------------
# Cast registry — THE source of consistency.
#
# narrator: ONE ElevenLabs voice speaks the entire video (single-narrator
# format, like every big explainer channel). The characters below are SILENT
# actors: the script writer directs them (poses, emotions, movements) and the
# renderer draws them identically in every video.
#
# voice_id: the default is the well-known ElevenLabs premade voice "Adam".
# For a distinctive channel, clone/design your own voice (you have premium)
# and paste its ID here. List available IDs:  python -m pipeline list-voices
#
# IMPORTANT for voice consistency:
#   - keep model_id = eleven_multilingual_v2 (request stitching, which keeps
#     prosody consistent across a long video, is NOT supported by eleven_v3)
#   - tune stability/style once, then freeze them
#   - speed 1.07 keeps long-form pacing brisk without sounding rushed
# ----------------------------------------------------------------------------

narrator:
  voice:
    voice_id: pNInz6obpgDQGcFmaJgB   # ElevenLabs premade "Adam" — replace with your own
    model_id: eleven_multilingual_v2
    stability: 0.50
    similarity_boost: 0.80
    style: 0.45
    use_speaker_boost: true
    speed: 1.07

characters:

  sticky:
    display_name: Sticky
    persona: >
      The protagonist — "you". Every relatable struggle, mistake and win in
      the narration happens to Sticky. Expressive, dramatic body language.
    color: "#1B1B1F"
    accessory: none        # none | glasses | hat | bowtie | mustache
    hair: spiky            # none | spiky | bob | curly

  prof:
    display_name: Prof. Cortex
    persona: >
      The brain/expert figure. Appears when the narration explains mechanisms
      or studies: points at diagrams, presents evidence, reveals twists.
    color: "#1F3A5F"
    accessory: glasses
    hair: curly

  doubt:
    display_name: Doubt
    persona: >
      The antagonist — inner critic, temptation, social pressure. Appears
      when the narration describes what sabotages you; smug, looming,
      dismissive. Gets defeated in payoff beats.
    color: "#7A1E1E"
    accessory: none
    hair: none
